# MEDHA single-service deployment (one Render Web Service).
#
# Architecture: the Docker image (Dockerfile) runs uvicorn on loopback :8000
# plus `next start` on $PORT under scripts/run_service.py. Next.js rewrites
# proxy /api/* and /health to FastAPI, so the browser uses one public origin.
# SSE streams through unbuffered (backend sends X-Accel-Buffering: no).
#
# State: Supabase Postgres is the main backend (ADR-029). Set
# MEDHA_DATABASE_URL in the Render dashboard (secret — never commit it);
# when set, it takes precedence and run history survives redeploys with no
# disk needed. MEDHA_DATABASE_PATH below is the SQLite fallback (ephemeral
# on the free plan: fresh database on restart unless a paid disk is mounted
# at /var/medha-data).
services:
  - type: web
    name: medha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MEDHA_ENV
        value: production
      - key: MEDHA_DEBUG
        value: "false"
      - key: MEDHA_EXECUTOR_MODE
        value: simulator
      - key: MEDHA_DOCKER_EXECUTE
        value: "false"
      - key: MEDHA_DATABASE_PATH
        value: /var/medha-data/medha.db
      # Main backend database (Supabase Postgres). sync: false means Render
      # takes the value from the dashboard (secret), not from this file.
      # Use the pooled connection (port 6543) for hosted use; the direct
      # connection (port 5432) is fine for local development.
      # Format: postgresql://postgres:<PASSWORD>@db.<ref>.supabase.co:6543/postgres
      - key: MEDHA_DATABASE_URL
        sync: false
      - key: MEDHA_LOG_LEVEL
        value: INFO
      # Same-origin deployment: the browser never contacts the backend
      # directly. Update this to the service's public URL after creation;
      # it is only a fallback and is not on the request path.
      - key: MEDHA_CORS_ORIGINS
        value: https://medha.onrender.com
      # Shared secret for mutating API routes. Generated once by Render,
      # injected server-side by Next.js middleware, never in the bundle.
      # The backend fails closed (503) in production if this is missing.
      - key: MEDHA_API_TOKEN
        generateValue: true
      # --- Clerk production authentication (dashboard secrets) ---
      # Create a PRODUCTION Clerk instance first, then paste values here.
      # ALL of these are required: without them the backend refuses to boot
      # (fail-closed) and the frontend renders guest-only mode.
      - key: MEDHA_AUTH_MODE
        value: clerk
      - key: CLERK_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Only needed for custom Clerk domains; skip for *.clerk.accounts.dev.
      # - key: CLERK_JWKS_URL
      #   sync: false
      # --- AI providers (dashboard secrets; missing keys keep deterministic mode) ---
      - key: MEDHA_AI_ENABLED
        value: "true"
      - key: MEDHA_AI_PRIMARY_PROVIDER
        value: groq
      - key: MEDHA_AI_FALLBACK_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # --- GitHub webhook routing (dashboard secret + allowlist) ---
      # The secret must exactly match the GitHub webhook secret. Project
      # connections (per-owner, via the UI) are the primary routing table;
      # the allowlist below remains a server-level guard.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: MEDHA_WEBHOOK_ALLOWED_REPOS
        sync: false
      - key: MEDHA_WEBHOOK_BRANCHES
        value: main

name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository. No secrets are exposed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # Deterministic, execution-disabled test environment. Never real Docker.
      MEDHA_ENV: development
      MEDHA_DOCKER_EXECUTE: "false"
      MEDHA_EXECUTOR_MODE: simulator
      MEDHA_DATABASE_URL: ""
      MEDHA_DATABASE_PATH: ./data/ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (Docker-gated tests excluded)
        run: python -m pytest -q -m "not docker"

  frontend:
    name: Frontend (test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
